services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chat_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chat_password}
      POSTGRES_DB: ${POSTGRES_DB:-chat}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chat_user} -d ${POSTGRES_DB:-chat}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "${POSTGRES_BIND:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: ${RESTART_POLICY:-unless-stopped}

  server:
    build:
      context: ./server-go
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-chat_user}:${POSTGRES_PASSWORD:-chat_password}@postgres:5432/${POSTGRES_DB:-chat}
      PORT: 3000
      PUBSUB_ADAPTER: ${PUBSUB_ADAPTER:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-25}
      DB_MIN_CONNS: ${DB_MIN_CONNS:-5}
    env_file:
      - ./server-go/.env
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    ports:
      - "${SERVER_BIND:-127.0.0.1}:${SERVER_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: ${RESTART_POLICY:-unless-stopped}

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      PUBLIC_URL: ${PUBLIC_URL:-https://localhost}
      CLIENT_HTTP_PORT: ${CLIENT_HTTP_PORT:-80}
      CLIENT_HTTPS_PORT: ${CLIENT_HTTPS_PORT:-443}
    ports:
      - "${CLIENT_HTTP_BIND:-0.0.0.0}:${CLIENT_HTTP_PORT:-80}:${CLIENT_HTTP_PORT:-80}"
      - "${CLIENT_HTTPS_BIND:-0.0.0.0}:${CLIENT_HTTPS_PORT:-443}:${CLIENT_HTTPS_PORT:-443}"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -k -fsS --resolve '${PUBLIC_HOST:-localhost}:${CLIENT_HTTPS_PORT:-443}:127.0.0.1' 'https://${PUBLIC_HOST:-localhost}:${CLIENT_HTTPS_PORT:-443}/healthz' >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: ${RESTART_POLICY:-unless-stopped}

  # Optional Redis service — enable with: docker compose --profile redis up
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: ${RESTART_POLICY:-unless-stopped}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
  redis_data:
